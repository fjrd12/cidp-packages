[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cidp-packages"
version = "0.1.0"
description = "Shared libraries for the Crypto Investment Decision Platform: the Bitso adapter, DB-shaped models, and common retry/backoff utilities."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Pyflakes/pycodestyle errors, isort, pyupgrade, flake8-bugbear: catches real
# bugs and keeps imports tidy without the noise of ruff's full default rule
# set (bandit, trio/async, pyi, furb, etc. — too strict for early-stage V0).
select = ["E", "F", "I", "UP", "B"]
